name: Update Polestar 4 tracker

on:
  schedule:
    - cron: "23 * * * *"   # hourly (xx:23 — top-of-hour schedules get delayed/dropped)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-polestar4
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape and merge
        id: scrape
        run: node scrape.js
        continue-on-error: true

      - name: Report broken scrape
        if: steps.scrape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        # hourly schedule: only file the alert if one isn't already open
        run: |
          open_count=$(gh issue list --state open --search '"scrape looks broken" in:title' --json number --jq 'length')
          if [ "$open_count" = "0" ]; then
            gh issue create --title "⚠️ Polestar 4 scrape looks broken ($(date -u +%F))" --body-file scrape-error.txt
          else
            echo "Skipping: a 'scrape looks broken' issue is already open."
          fi

      - name: Resolve broken-scrape alert on recovery
        if: steps.scrape.outcome == 'success'
        continue-on-error: true   # housekeeping must not fail an otherwise-good update
        env:
          GH_TOKEN: ${{ github.token }}
        # The scrape recovered — auto-close any open "looks broken" alert so the
        # dedup guard in "Report broken scrape" can fire again on a future outage.
        run: |
          gh issue list --state open --search '"scrape looks broken" in:title' --json number --jq '.[].number' \
          | while read -r n; do
              [ -z "$n" ] && continue
              gh issue close "$n" --reason completed \
                --comment "✅ Scrape recovered on $(date -u +%F) (run [\`$GITHUB_RUN_ID\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Auto-closing — the previous failure was transient."
            done

      - name: Fail the run if scrape broke
        if: steps.scrape.outcome == 'failure'
        run: exit 1

      - name: Build, commit & deploy
        if: steps.scrape.outputs.changed == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.scrape.outputs.commit_message }}
        run: |
          node build.js
          git config user.name "polestar4-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html feed.xml HISTORY.md
          git commit -m "$COMMIT_MESSAGE"
          git push

      - name: Announce new version
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.new_versions != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSIONS: ${{ steps.scrape.outputs.new_versions }}
          OWNER: ${{ github.repository_owner }}
        # @mention + assign the owner: both are "Direct" notifications, which the
        # GitHub mobile app pushes by default (plain "watching" issues do not).
        run: |
          { echo "@$OWNER — a new Polestar 4 software update is live."; echo; cat new-version-issue.md; } > issue-body.md
          gh issue create --title "🔔 New update $NEW_VERSIONS detected" --body-file issue-body.md --assignee "$OWNER"

      - name: Announce changelog edit
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.changed_notes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_NOTES: ${{ steps.scrape.outputs.changed_notes }}
        # Files a 📝 issue with the +added/-removed diff from notes-change.md.
        # Deliberately no @mention/assignee — notes edits are the quiet channel
        # (the loud, mobile-pushed treatment is reserved for new versions).
        run: |
          {
            echo "Polestar edited the release notes of an already-published version."
            echo
            echo '```diff'
            cat notes-change.md
            echo '```'
            echo
            echo "[View the tracker](https://jaybizzle.github.io/polestar4-updates/)"
          } > notes-change-issue.md
          gh issue create --title "📝 Release notes edited: $CHANGED_NOTES ($(date -u +%F))" --body-file notes-change-issue.md

      - name: Announce prerelease going official
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.released_versions != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.scrape.outputs.released_versions }}
        # A version we were tracking as a prerelease now appears on the public
        # manual page — Polestar made it official. Quiet channel (no
        # mention/assignee): the loud treatment already fired when the version
        # first appeared in the API.
        run: |
          {
            echo "$RELEASED was tracked as a pre-release and is now listed on Polestar's public manual page — the release is official."
            echo
            echo "[View the tracker](https://jaybizzle.github.io/polestar4-updates/)"
          } > released-issue.md
          gh issue create --title "🚀 $RELEASED is now official ($(date -u +%F))" --body-file released-issue.md

      - name: Announce upcoming-builds change
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.changed_upcoming != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_UPCOMING: ${{ steps.scrape.outputs.changed_upcoming }}
        # The registered-but-unpublished builds list (meta.upcoming, from
        # available-car-models) changed: a future build appeared, vanished or
        # was relabelled (e.g. 4.3 losing its name to 4.2.15). Body is the
        # +added/-removed diff from upcoming-change.md. Quiet channel.
        run: |
          {
            echo "Polestar's registered-but-unpublished builds changed — the early-warning list of updates that have no release notes yet."
            echo
            echo '```diff'
            cat upcoming-change.md
            echo '```'
            echo
            echo "[View the tracker](https://jaybizzle.github.io/polestar4-updates/)"
          } > upcoming-change-issue.md
          gh issue create --title "🚧 Upcoming builds changed: $CHANGED_UPCOMING ($(date -u +%F))" --body-file upcoming-change-issue.md

      - name: Push notification — new version (ntfy)
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.new_versions != ''
        continue-on-error: true   # a notification outage must not fail the update
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NEW_VERSIONS: ${{ steps.scrape.outputs.new_versions }}
        # Dormant until the NTFY_TOPIC repo secret is set. Phone-push independent
        # of GitHub's notification routing.
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set — skipping push."; exit 0; fi
          curl -fsS \
            -H "Title: New Polestar 4 update: $NEW_VERSIONS" \
            -H "Tags: bell,car" \
            -H "Click: https://jaybizzle.github.io/polestar4-updates/" \
            -d "Release notes are live. Tap to open the tracker." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Push notification — changelog edited (ntfy)
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.changed_notes != ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHANGED_NOTES: ${{ steps.scrape.outputs.changed_notes }}
        # Fires when an already-known version's notes are edited. Body is the
        # +added/-removed diff written to notes-change.md by scrape.js.
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set — skipping push."; exit 0; fi
          curl -fsS \
            -H "Title: Polestar 4 changelog edited: $CHANGED_NOTES" \
            -H "Tags: memo,car" \
            -H "Click: https://jaybizzle.github.io/polestar4-updates/" \
            --data-binary @notes-change.md \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Push notification — prerelease went official (ntfy)
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.released_versions != ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RELEASED: ${{ steps.scrape.outputs.released_versions }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set — skipping push."; exit 0; fi
          curl -fsS \
            -H "Title: Polestar 4 $RELEASED is now official" \
            -H "Tags: rocket,car" \
            -H "Click: https://jaybizzle.github.io/polestar4-updates/" \
            -d "Now listed on the public manual page — the release is official. Tap to open the tracker." \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Push notification — upcoming builds changed (ntfy)
        if: steps.scrape.outputs.changed == 'true' && steps.scrape.outputs.changed_upcoming != ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Body is the +added/-removed diff written to upcoming-change.md.
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC not set — skipping push."; exit 0; fi
          curl -fsS \
            -H "Title: Polestar 4 upcoming builds changed" \
            -H "Tags: construction,car" \
            -H "Click: https://jaybizzle.github.io/polestar4-updates/" \
            --data-binary @upcoming-change.md \
            "https://ntfy.sh/$NTFY_TOPIC"
